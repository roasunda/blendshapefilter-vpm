name: Release

# Tag a commit like "v1.0.0" and push the tag to trigger this.
# It zips the package (package.json at the zip root, as VPM expects) and attaches
# it to a new GitHub Release. Grab the release asset's URL and SHA256 afterwards
# to fill in vpm-index/index.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package.json
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip package
        run: |
          zip -r "${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip"
          generate_release_notes: true
